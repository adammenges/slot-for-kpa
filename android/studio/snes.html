<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNES Cart Studio</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 28px;background:#1b1b21;color:#eee9df;font:16px system-ui,sans-serif}h1{font-size:20px;margin:0 0 16px}h2{font-size:17px;margin:0 0 12px}p{color:#bbb5c1;line-height:1.5}button,input,select{font:inherit;color:inherit;background:#34313c;border:1px solid #77717f;border-radius:5px;padding:10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}:focus-visible{outline:3px solid #cbb3ff;outline-offset:3px}.layout{display:grid;grid-template-columns:220px minmax(260px,1fr) 230px;gap:24px;align-items:start}.library label{display:block;margin-bottom:8px}.library input,.library select{width:100%}.library select{margin-top:10px;padding:4px}.library option{padding:9px 6px}.preview{align-self:center;text-align:center}.preview canvas{width:100%;max-width:420px;height:auto}.preview p{font-size:13px;overflow-wrap:anywhere}.controls button{margin:0 5px 8px 0}.colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}.colors button{width:34px;height:34px;margin:0;border:2px solid #77717f}.colors button[aria-pressed=true]{border-color:white;box-shadow:0 0 0 2px #b99ce8}#write{background:#eee9df;color:#25222c}#status{min-height:42px;font-size:14px;margin-bottom:0}#pending{font-size:13px}hr{border:0;border-top:1px solid #49434e;margin:18px 0}input[type=color]{padding:2px;width:44px;height:34px;vertical-align:middle}body.embedded{padding:12px 0}body.embedded h1{display:none}body.single .layout{grid-template-columns:minmax(260px,1fr) 260px}@media(max-width:760px){.layout{grid-template-columns:160px 1fr;gap:16px}.controls{grid-column:1/-1}.library select{height:160px}}
body.embedded .controls{font-size:14px}body.embedded .controls button{padding:8px}body.embedded .controls hr{margin:12px 0}body.embedded .controls p{margin:10px 0;line-height:1.4}body.embedded #status{min-height:0}
</style>
<h1>Super Nintendo</h1>
<div class="layout">
<section class="library" aria-label="SNES library">
<label for="search">Find a cartridge</label><input id="search" type="search" placeholder="Search titles…" autocomplete="off">
<select id="games" size="6" aria-label="SNES cartridge"></select><p id="pending" role="status"></p>
</section>
<section class="preview"><canvas id="preview" width="720" height="480" aria-label="Cartridge preview"></canvas><p id="title"></p></section>
<section class="controls"><h2>Make it yours</h2>
<button id="pick">Choose PNG label…</button><input id="file" type="file" accept="image/png" hidden>
<p>Labels fill the recessed panel. Tall or wide images are cropped to fit.</p>
<hr><label>Shell color <input id="color" type="color" value="#b6b5bb" aria-label="Custom shell color"></label>
<div class="colors" id="colors" role="group" aria-label="Shell colors"></div><button id="automatic">Original gray</button>
<hr><button id="write" disabled>Save changes</button><button id="discard" disabled>Discard changes</button>
<p id="status" role="status" aria-live="polite"></p>
</section></div>
<script type="module" src="snes.mjs"></script>
</html>
